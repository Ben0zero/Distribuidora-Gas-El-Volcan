# ==============================================================================
#  Distribuidora de Gas El Volcán — Versión 2 (React + Vite + React Bootstrap)
#  Configuración de Nginx para publicar la SPA en el puerto 80
#
#  Ubicación sugerida:  /etc/nginx/sites-available/elvolcan
#  (ver DEPLOY.md para los comandos de instalación)
# ==============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Sirve por IP pública (o por dominio cuando tengas uno)
    server_name _;

    # Carpeta donde se copia el contenido de dist/
    root /var/www/html;
    index index.html;

    # --------------------------------------------------------------------------
    # CLAVE PARA REACT ROUTER (evita el error 404 al refrescar)
    # Si el archivo o carpeta no existe, devuelve index.html y deja que
    # React Router resuelva la ruta (/productos, /admin, /carrito, etc.).
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cachea imágenes, CSS, JS y fuentes (mejora el rendimiento).
    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|webp|css|js|woff2?)$ {
        expires 7d;
        access_log off;
    }

    # Logs propios del sitio
    access_log /var/log/nginx/elvolcan.access.log;
    error_log  /var/log/nginx/elvolcan.error.log;
}

# ==============================================================================
#  HTTPS (opcional). Después de tener un dominio, instala certbot y ejecuta:
#     sudo apt install -y certbot python3-certbot-nginx
#     sudo certbot --nginx -d tudominio.cl -d www.tudominio.cl
#  Certbot agrega automáticamente el bloque 443 y la redirección desde el 80.
# ==============================================================================
