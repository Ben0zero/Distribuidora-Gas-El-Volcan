            <h1 class="display-6 mb-4 text-dark fw-bold">NUEVO PRODUCTO</h1>

            <div class="card border border-2 shadow-sm rounded-0 mx-auto" style="max-width: 900px;">
                
                <div class="card-header bg-secondary bg-opacity-25 py-2 border-bottom border-2 text-uppercase fw-bold text-secondary" style="font-size: 0.85rem;">
                    Gestión de inventario y stock
                </div>

                <div class="card-body p-4">
                    <form id="form-nuevo-producto">
                        
                        <!-- codigo del producto (min 3 caract) -->
                        <div class="mb-3">
                            <label for="codigo-producto" class="form-label text-uppercase fw-bold text-secondary" style="font-size: 0.75rem;">Código del Producto (Min. 3 caracteres)</label>
                            <input type="text" class="form-control rounded-0 border-dark" id="codigo-producto" minlength="3" placeholder="Ej: CL001" required>
                        </div>

                        <!-- nombre del producto (max 100) -->
                        <div class="mb-3">
                            <label for="nombre-producto" class="form-label text-uppercase fw-bold text-secondary" style="font-size: 0.75rem;">Nombre del Producto (Max. 100 caracteres)</label>
                            <input type="text" class="form-control rounded-0 border-dark" id="nombre-producto" maxlength="100" placeholder="Ej: Cilindro de Gas 15 Kg" required>
                        </div>

                        <!-- descripcion (ppcional max 500) -->
                        <div class="mb-3">
                            <label for="descripcion-producto" class="form-label text-uppercase fw-bold text-secondary" style="font-size: 0.75rem;">Descripción (Opcional, Max. 500 caracteres)</label>
                            <textarea class="form-control rounded-0 border-dark" id="descripcion-producto" rows="3" maxlength="500" placeholder="Detalles del producto..."></textarea>
                        </div>

                        <!-- fila para precio y stock -->
                        <div class="row mb-3">
                            <div class="col-md-6 mb-3 mb-md-0">
                                <label for="precio-producto" class="form-label text-uppercase fw-bold text-secondary" style="font-size: 0.75rem;">Precio ($)</label>
                                <input type="number" step="0.01" min="0" class="form-control rounded-0 border-dark" id="precio-producto" placeholder="Ej: 15990" required>
                            </div>
                            <div class="col-md-6">
                                <label for="stock-producto" class="form-label text-uppercase fw-bold text-secondary" style="font-size: 0.75rem;">Stock Inicial (Enteros)</label>
                                <input type="number" step="1" min="0" class="form-control rounded-0 border-dark" id="stock-producto" placeholder="Ej: 50" required>
                            </div>
                        </div>

                        <!-- fila para stock critico y categoria -->
                        <div class="row mb-4">
                            <div class="col-md-6 mb-3 mb-md-0">
                                <label for="stock-critico" class="form-label text-uppercase fw-bold text-secondary" style="font-size: 0.75rem;">Stock Crítico (Alerta opcional)</label>
                                <input type="number" step="1" min="0" class="form-control rounded-0 border-dark" id="stock-critico" placeholder="Ej: 5">
                            </div>
                            <div class="col-md-6">
                                <label for="categoria-producto" class="form-label text-uppercase fw-bold text-secondary" style="font-size: 0.75rem;">-- Seleccione la Categoría --</label>
                                <select class="form-select rounded-0 border-dark" id="categoria-producto" required>
                                    <option selected disabled>Elige una categoría...</option>
                                    <option>Cilindros Residenciales</option>
                                    <option>Cilindros Comerciales</option>
                                    <option>Accesorios y Reguladores</option>
                                </select>
                            </div>
                        </div>

                        <!-- imagen (opcional) -->
                        <div class="mb-4">
                            <label for="imagen-producto" class="form-label text-uppercase fw-bold text-secondary" style="font-size: 0.75rem;">Imagen del Producto (Opcional)</label>
                            <input type="file" class="form-control rounded-0 border-dark" id="imagen-producto">
                        </div>

                        <!-- oton guardar producto -->
                        <div class="text-center mt-4">
                            <button type="submit" class="btn btn-dark text-uppercase px-5 py-2 rounded-0 fw-bold" style="font-size: 0.9rem;">
                                Guardar Producto
                            </button>
                        </div>

                    </form>
                </div>
            </div>
