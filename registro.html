<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta | Distribuidora de Gas El Volcán</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"  rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- CSS propio -->
    <link rel="stylesheet"  href="CSS/estilos.css"> </head>


<body>

    <a href="tiendas.html" class="boton-tienda">
    <img src="IMAGENES/loguito-boton.png" alt="Encuentra tu tienda más cercana"> </a>
    <!-- ================================= -->
    <!-- HEADER -->
    <!-- ================================= -->
    <header>
        <div class="container">
            <div class="row align-items-center text-center">
                <!-- LOGO -->
                <div class="col">
                    <img src="IMAGENES/Logo Gas.png"
                         style="width: 90px;"
                         alt="Logo Corporativo">
                </div>
                <!-- NAVEGACIÓN -->
                <div class="col">
                    <a href="index.html" class="btn"> Inicio </a>
                    <a href="catalogo.html" class="btn"> Catalogo</a>
                    <a href="consejos.html" class="btn"> Consejos </a>
                    <a href="contacto.html" class="btn"> Contacto </a>
                </div>
                <!-- ACCIONES -->
                <div class="col">
                    <a href="login.html" class="btn btn-login"> Acceder </a>
                    <a href="carrito.html" class="btn btn-carrito" aria-label="Carrito de compras">
                        <i class="bi bi-cart-fill"></i>
                    </a>
                </div>
            </div>
        </div>
    </header>
    <!-- ================================= -->
    <!-- REGISTRO -->
    <!-- ================================= -->
    <main class="fondo">
        <section class="container py-5">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">
                    <div class="registro-contenedor">
                        <!-- TÍTULO -->
                        <div class="text-center mb-4">
                            <i class="bi bi-person-plus-fill icono-registro"></i>
                            <h1> Crear cuenta </h1>
                            <p>
                                Regístrate para realizar tus pedidos
                                y acceder a nuestros productos.
                            </p>
                        </div>
                        <!-- FORMULARIO -->
                        <form id="formulario-registro">
                            <!-- NOMBRE -->
                            <div class="mb-3">
                                <label for="nombre"
                                       class="form-label">
                                    Nombre completo
                                </label>
                                <input type="text"
                                       class="form-control"
                                       id="nombre"
                                       name="nombre"
                                       placeholder="Ingresa tu nombre completo"
                                       required>
                            </div>
                            <!-- CORREO -->
                            <div class="mb-3">
                                <label for="correo"
                                       class="form-label">
                                    Correo electrónico
                                </label>
                                <input type="email"
                                       class="form-control"
                                       id="correo"
                                       name="correo"
                                       placeholder="ejemplo@correo.com"
                                       required>
                            </div>
                            <!-- TELÉFONO -->
                            <div class="mb-3">
                                <label for="telefono"
                                       class="form-label">
                                    Teléfono
                                </label>
                                <input type="tel"
                                       class="form-control"
                                       id="telefono"
                                       name="telefono"
                                       placeholder="+56 9 XXXX XXXX"
                                       required>
                            </div>
                            <!-- TIPO DE CLIENTE -->
                            <div class="mb-3">
                                <label for="tipo-cliente"
                                       class="form-label">
                                    Tipo de cliente
                                </label>
                                <select class="form-select"
                                        id="tipo-cliente"
                                        name="tipo-cliente"
                                        required>
                                    <option value="">
                                        Seleccione una opción
                                    </option>
                                    <option value="residencial">
                                        Residencial
                                    </option>
                                    <option value="comercial">
                                        Comercial
                                    </option>
                                </select>
                            </div>
                            <!-- DIRECCIÓN -->
                            <div class="mb-3">
                                <label for="direccion"
                                       class="form-label">
                                    Dirección de despacho
                                </label>
                                <input type="text"
                                       class="form-control"
                                       id="direccion"
                                       name="direccion"
                                       placeholder="Ingresa tu dirección"
                                       required>
                            </div>
                            <div class="mb-3">
                                <label for="comuna" class="form-label">
                                    Comuna de despacho
                                </label>
                                <select class="form-select"
                                        id="comuna"
                                        name="comuna"
                                        required>
                                    <option value="">
                                        Seleccione su comuna
                                    </option>
                                    <option value="chillan">
                                        Chillán
                                    </option>
                                    <option value="chillan-viejo">
                                        Chillán Viejo
                                    </option>
                                    <option value="el-carmen">
                                        El Carmen
                                    </option>
                                    <option value="pinto">
                                        Pinto
                                    </option>
                                    <option value="san-ignacio">
                                        San Ignacio
                                    </option>
                                    <option value="bulnes">
                                        Bulnes
                                    </option>
                                    <option value="quillon">
                                        Quillón
                                    </option>
                                </select>
                            </div>
                            <!-- CONTRASEÑA -->
                            <div class="mb-3">
                                <label for="password"
                                       class="form-label">
                                    Contraseña
                                </label>
                                <input type="password"
                                       class="form-control"
                                       id="password"
                                       name="password"
                                       placeholder="Crea una contraseña"
                                       required>
                            </div>
                            <!-- CONFIRMAR CONTRASEÑA -->
                            <div class="mb-4">
                                <label for="confirmar-password"
                                       class="form-label">
                                    Confirmar contraseña
                                </label>
                                <input type="password"
                                       class="form-control"
                                       id="confirmar-password"
                                       name="confirmar-password"
                                       placeholder="Repite tu contraseña"
                                       required>
                            </div>
                            <!-- TÉRMINOS -->
                            <div class="form-check mb-4">
                                <input class="form-check-input"
                                       type="checkbox"
                                       id="terminos"
                                       required>
                                <label class="form-check-label"
                                       for="terminos">
                                    Acepto los términos y condiciones
                                    del servicio.
                                </label>
                            </div>
                            <!-- BOTÓN -->
                            <div class="d-grid">
                                <button type="submit"
                                        class="btn btn-login">
                                    <i class="bi bi-person-check-fill"></i>
                                    Crear cuenta
                                </button>
                            </div>
                        </form>
                        <!-- VOLVER AL LOGIN -->
                        <div class="text-center mt-4">
                            <p>
                                ¿Ya tienes una cuenta?
                                <a href="login.html">
                                    Inicia sesión aquí
                                </a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <!-- ================================= -->
    <!-- FOOTER -->
    <!-- ================================= -->
    <footer>
    <div class="container py-3">
        <div class="row align-items-center text-center">            
                <div class="col">
                    <img src="IMAGENES/Logo Gas.png" style="width: 90px;" alt="Logo Coorporativo">
                </div>
                <div class="col">
                    <h5>Contacto</h5>  
                    <p>+56 42 234 5678 · pedidos@elvolcangas.cl</p>                 
                </div>
                <div class="col">                    
                        <figcaption class="blockquote-footer">
                        © 2026 Distribuidora de Gas El Volcán. Proyecto académico DSY1104.
                        </figcaption>
                </div>          
        </div>
    </div>
</footer>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>
</body>

</html>
