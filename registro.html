    <!-- REGISTRO -->
    <!-- ================================= -->
    <main class="fondo">
        <section class="container py-5">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">
                    <div class="registro-contenedor">
                        <!-- TÍTULO -->
                        <div class="text-center mb-4">
                            <i class="bi bi-person-plus-fill icono-registro"></i>
                            <h1> Crear cuenta </h1>
                            <p>
                                Regístrate para realizar tus pedidos
                                y acceder a nuestros productos.
                            </p>
                        </div>
                        <!-- FORMULARIO -->
                        <form id="formulario-registro">
                            <!-- NOMBRE -->
                            <div class="mb-3">
                                <label for="nombre"
                                       class="form-label">
                                    Nombre completo
                                </label>
                                <input type="text"
                                       class="form-control"
                                       id="nombre"
                                       name="nombre"
                                       maxlength="100"
                                       placeholder="Ingresa tu nombre completo"
                                       required>
                            </div>
                            <!-- RUN (7 a 9 digitos, sin puntos y sin guion) -->
                            <div class="mb-3">
                                <label for="run"
                                       class="form-label">
                                    RUN (7 a 9 dígitos, sin puntos y sin guion)
                                </label>
                                <input type="text"
                                       class="form-control"
                                       id="run"
                                       name="run"
                                       pattern="[0-9]{7,9}"
                                       maxlength="9"
                                       placeholder="Ej: 12345678"
                                       required>
                            </div>
                            <!-- CORREO -->
                            <div class="mb-3">
                                <label for="correo"
                                       class="form-label">
                                    Correo electrónico
                                </label>
                                <input type="email"
                                       class="form-control"
                                       id="correo"
                                       name="correo"
                                       placeholder="ejemplo@correo.com"
                                       required>
                            </div>
                            <!-- TELÉFONO -->
                            <div class="mb-3">
                                <label for="telefono"
                                       class="form-label">
                                    Teléfono
                                </label>
                                <input type="tel"
                                       class="form-control"
                                       id="telefono"
                                       name="telefono"
                                       placeholder="+56 9 XXXX XXXX"
                                       required>
                            </div>
                            <!-- TIPO DE CLIENTE -->
                            <div class="mb-3">
                                <label for="tipo-cliente"
                                       class="form-label">
                                    Tipo de cliente
                                </label>
                                <select class="form-select"
                                        id="tipo-cliente"
                                        name="tipo-cliente"
                                        required>
                                    <option value="">
                                        Seleccione una opción
                                    </option>
                                    <option value="residencial">
                                        Residencial
                                    </option>
                                    <option value="comercial">
                                        Comercial
                                    </option>
                                </select>
                            </div>
                            <!-- DIRECCIÓN -->
                            <div class="mb-3">
                                <label for="direccion"
                                       class="form-label">
                                    Dirección de despacho
                                </label>
                                <input type="text"
                                       class="form-control"
                                       id="direccion"
                                       name="direccion"
                                       placeholder="Ingresa tu dirección"
                                       required>
                            </div>
                            <!-- REGIÓN -->
                            <div class="mb-3">
                                <label for="region" class="form-label">
                                    Región
                                </label>
                                <select class="form-select"
                                        id="region"
                                        name="region"
                                        required>
                                    <option value="" selected disabled>
                                        Seleccione su región
                                    </option>
                                </select>
                            </div>
                            <!-- COMUNA -->
                            <div class="mb-3">
                                <label for="comuna" class="form-label">
                                    Comuna de despacho
                                </label>
                                <select class="form-select"
                                        id="comuna"
                                        name="comuna"
                                        required>
                                    <option value="">
                                        Seleccione su comuna
                                    </option>
                                </select>
                            </div>
                            <!-- CONTRASEÑA -->
                            <div class="mb-3">
                                <label for="password"
                                       class="form-label">
                                    Contraseña
                                </label>
                                <input type="password"
                                       class="form-control"
                                       id="password"
                                       name="password"
                                       minlength="4"
                                       maxlength="10"
                                       placeholder="Crea una contraseña (4 a 10 caracteres)"
                                       required>
                            </div>
                            <!-- CONFIRMAR CONTRASEÑA -->
                            <div class="mb-4">
                                <label for="confirmar-password"
                                       class="form-label">
                                    Confirmar contraseña
                                </label>
                                <input type="password"
                                       class="form-control"
                                       id="confirmar-password"
                                       name="confirmar-password"
                                       minlength="4"
                                       maxlength="10"
                                       placeholder="Repite tu contraseña"
                                       required>
                            </div>
                            <!-- TÉRMINOS -->
                            <div class="form-check mb-4">
                                <input class="form-check-input"
                                       type="checkbox"
                                       id="terminos"
                                       required>
                                <label class="form-check-label"
                                       for="terminos">
                                    Acepto los términos y condiciones
                                    del servicio.
                                </label>
                            </div>
                            <!-- BOTÓN -->
                            <div class="d-grid">
                                <button type="submit"
                                        class="btn btn-login">
                                    <i class="bi bi-person-check-fill"></i>
                                    Crear cuenta
                                </button>
                            </div>
                        </form>
                        <!-- VOLVER AL LOGIN -->
                        <div class="text-center mt-4">
                            <p>
                                ¿Ya tienes una cuenta?
                                <a href="login.html">
                                    Inicia sesión aquí
                                </a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
