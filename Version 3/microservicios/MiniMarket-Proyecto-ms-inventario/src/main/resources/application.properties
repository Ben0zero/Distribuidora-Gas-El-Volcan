spring.application.name=ms-inventario

# --- SECRETOS (fuera del repositorio) ---
# Copiar microservicios/secrets.example.properties a ~/.elvolcan/secrets.properties y completar
spring.config.import=optional:file:${user.home}/.elvolcan/secrets.properties
jwt.secret=${JWT_SECRET}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
eureka.instance.prefer-ip-address=true


server.port=8084


spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@clases_high?TNS_ADMIN=${ORACLE_WALLET_DIR}
spring.datasource.username=${DB_USER:ADMIN}
spring.datasource.password=${DB_PASSWORD}


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

# --- Cliente de Eureka ---
eureka.client.service-url.defaultZone=${EUR_SERVER:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


spring.flyway.enabled=false

# CONFIGURACIÓN CRÍTICA: Limitar el Pool para el Free Tier de Oracle
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# --- Semilla de datos ---
# true = borra y vuelve a cargar los 14 productos de El Volcan al iniciar (usar una sola vez)
app.semilla.reiniciar=${REINICIAR_SEMILLA:false}
