# ============================================================
#  PLANTILLA de secretos para los microservicios de El Volcán
# ------------------------------------------------------------
#  1. Copia este archivo a:  <tu carpeta de usuario>/.elvolcan/secrets.properties
#       Windows:  C:\Users\<usuario>\.elvolcan\secrets.properties
#  2. Reemplaza los valores de ejemplo por los reales.
#  3. NUNCA subas el archivo real al repositorio.
#
#  Cada microservicio lo carga con:
#    spring.config.import=optional:file:${user.home}/.elvolcan/secrets.properties
#  También puedes definir estas claves como variables de entorno.
# ============================================================

# Usuario de la base Oracle Cloud (por defecto ADMIN)
DB_USER=ADMIN

# Contraseña del usuario de la base Oracle Cloud
DB_PASSWORD=cambia_esta_contrasena

# Carpeta donde descomprimiste el Wallet de Oracle (usa / como separador)
ORACLE_WALLET_DIR=C:/Users/<usuario>/.elvolcan/OracleWallet

# Clave para firmar y validar los JWT (mínimo 32 caracteres, la MISMA en todos los servicios)
JWT_SECRET=reemplazar_por_una_clave_larga_de_al_menos_32_caracteres

# (Opcional) Orígenes permitidos para CORS, separados por coma
# CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174
