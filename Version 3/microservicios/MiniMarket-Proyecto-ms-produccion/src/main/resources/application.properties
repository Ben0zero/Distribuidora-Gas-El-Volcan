spring.application.name=produccion

# --- SECRETOS (fuera del repositorio) ---
# Copiar microservicios/secrets.example.properties a ~/.elvolcan/secrets.properties y completar
spring.config.import=optional:file:${user.home}/.elvolcan/secrets.properties
jwt.secret=${JWT_SECRET}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
server.port=8083

spring.flyway.enabled=false

#Oracle Connection con Wallet
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@clases_high?TNS_ADMIN=${ORACLE_WALLET_DIR}
spring.datasource.username=${DB_USER:ADMIN}
spring.datasource.password=${DB_PASSWORD}

#CONFIGURACIÓN CRÍTICA: Limitar el Pool para el Free Tier
#Con esto evitamos el ORA-12523
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

#JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
#Eliminamos la línea del dialecto manual, Spring Boot 3+ lo detecta solo y evita conflictos
spring.jpa.open-in-view=false

#Eureka Client
eureka.client.service-url.defaultZone=${EUR_SERVER:http://localhost:8761/eureka/}

# Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
