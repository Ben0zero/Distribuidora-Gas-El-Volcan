spring.application.name=ms-auth

# --- SECRETOS (fuera del repositorio) ---
# Copiar microservicios/secrets.example.properties a ~/.elvolcan/secrets.properties y completar
spring.config.import=optional:file:${user.home}/.elvolcan/secrets.properties
jwt.secret=${JWT_SECRET}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}

server.port=8081

# Proxies de los que se acepta X-Forwarded-For para el límite de intentos de login (IPs o CIDR).
# Por defecto solo la misma máquina (proxy de Vite). En Docker se sobrescribe con la variable
# APP_SEGURIDAD_PROXIES_CONFIABLES para incluir la red interna donde está Nginx (ver docker-compose.yml).
app.seguridad.proxies-confiables=127.0.0.1,::1

# Recuperación de contraseña: "log" (por defecto, el enlace queda en el log) o "correo" (SMTP).
# Para "correo" se definen spring.mail.* en ~/.elvolcan/secrets.properties (ver secrets.example.properties)
app.notificacion.modo=${NOTIFICACION_MODO:log}
# Tiempos máximos del SMTP (ms) para que un servidor de correo lento no deje colgada la petición
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# configuracion de eureka
eureka.client.service-url.defaultZone=${EUR_SERVER:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# --- NUEVA CONFIGURACION ORACLE CLOUD ---
spring.datasource.url=jdbc:oracle:thin:@clases_high?TNS_ADMIN=${ORACLE_WALLET_DIR}
spring.datasource.username=${DB_USER:ADMIN}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=update
# SQL fuera de los logs (H-12); activar solo para depurar en local
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.flyway.baseline-on-migrate=true
# Forzar a Flyway a usar la misma ruta de la Wallet de Docker
spring.flyway.url=jdbc:oracle:thin:@clases_high?TNS_ADMIN=${ORACLE_WALLET_DIR}
spring.flyway.user=${DB_USER:ADMIN}
spring.flyway.password=${DB_PASSWORD}

# CONFIGURACIÓN CRÍTICA: Limitar el Pool para el Free Tier de Oracle
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
