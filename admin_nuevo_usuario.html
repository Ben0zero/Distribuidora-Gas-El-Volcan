            <div class="nav nav-pills flex-column mb-3">

                    <a href="#" class="nav-link link-dark">
                        <i class="bi bi-gear me-2"></i> Configuración

                    <a class="dropdown-item" href="#">Ajustes</a>
                    <a class="dropdown-item" href="login.html">Cerrar sesión</a>
                </div>
            </div>
        </aside>

        <!-- contentido principal-->
        <main class="flex-grow-1 p-4 overflow-auto fondo-admin bg-transparent">
            
            <div class="d-flex justify-content-end mb-4">
                <a href="#" class="text-dark fs-4" aria-label="Notificaciones">
                    <i class="bi bi-bell-fill"></i>
                </a>
            </div>

            <h1 class="display-6 mb-4 text-dark fw-bold">NUEVO USUARIO</h1>

            <div class="card border border-2 shadow-sm rounded-0 mx-auto" style="max-width: 900px;">
                
                <div class="card-header bg-secondary bg-opacity-25 py-2 border-bottom border-2 text-uppercase fw-bold text-secondary" style="font-size: 0.85rem;">
                    Registro de usuario
                </div>

                <div class="card-body p-4">
                    <form id="form-nuevo-usuario">
                        
                        <div class="mb-3">
                            <label for="nombre" class="form-label text-uppercase fw-bold text-secondary" style="font-size: 0.75rem;">Nombre Completo</label>
                            <input type="text" class="form-control rounded-0 border-dark" id="nombre" required>
                        </div>

                        <div class="mb-3">
                            <label for="correo" class="form-label text-uppercase fw-bold text-secondary" style="font-size: 0.75rem;">Correo</label>
                            <input type="email" class="form-control rounded-0 border-dark" id="correo" required>
                        </div>

                        <div class="mb-3">
                            <label for="run" class="form-label text-uppercase fw-bold text-secondary" style="font-size: 0.75rem;">RUN (Sin puntos y con guion)</label>
                            <input type="text" class="form-control rounded-0 border-dark" id="run" placeholder="Ej: 12345678-9" required>
                        </div>

                        <div class="mb-3">
                            <label for="contrasena" class="form-label text-uppercase fw-bold text-secondary" style="font-size: 0.75rem;">Contraseña</label>
                            <input type="password" class="form-control rounded-0 border-dark" id="contrasena" required>
                        </div>

                        <div class="mb-3">
                            <label for="confirmar-contrasena" class="form-label text-uppercase fw-bold text-secondary" style="font-size: 0.75rem;">Confirmar Contraseña</label>
                            <input type="password" class="form-control rounded-0 border-dark" id="confirmar-contrasena" required>
                        </div>

                        <div class="mb-4">
                            <label for="telefono" class="form-label text-uppercase fw-bold text-secondary" style="font-size: 0.75rem;">Teléfono (Opcional)</label>
                            <input type="tel" class="form-control rounded-0 border-dark" id="telefono" placeholder="+569...">
                        </div>

                        <div class="row mb-4">
                            <div class="col-md-6 mb-3 mb-md-0">
                                <label for="region" class="form-label text-uppercase fw-bold text-secondary" style="font-size: 0.75rem;">-- Seleccione la región --</label>
                                <select class="form-select rounded-0 border-dark" id="region">
                                    <option selected disabled>Elige una región...</option>
                                    <option>Región Metropolitana de Santiago</option>
                                    <option>Región de La Araucanía</option>
                                    <option>Región de Ñuble</option>
                                    <option>Región de Valparaíso</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="comuna" class="form-label text-uppercase fw-bold text-secondary" style="font-size: 0.75rem;">-- Seleccione la comuna --</label>
                                <select class="form-select rounded-0 border-dark" id="comuna">
                                    <option selected disabled>Elige una comuna...</option>
                                    <option>Quilpué</option>
                                    <option>Viña del Mar</option>
                                    <option>Chillán</option>
                                    <option>Linares</option>
                                    <option>Longaví</option>
                                    <option>Concepción</option>
                                </select>
                            </div>
                        </div>

                        <div class="text-center mt-4">
                            <button type="submit" class="btn btn-dark text-uppercase px-5 py-2 rounded-0 fw-bold" style="font-size: 0.9rem;">
                                Registrar
                            </button>
                        </div>

                    </form>
                </div>
            </div>

        </main>
    </div>
