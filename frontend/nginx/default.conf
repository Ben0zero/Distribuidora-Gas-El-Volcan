# ==============================================================================
#  Distribuidora de Gas El Volcán — Nginx del contenedor "frontend" (Docker)
#
#  - Sirve la SPA de React (dist/) y resuelve las rutas de React Router.
#  - Reenvía /api/v1 y /api/v2 a cada microservicio por la red interna de Docker
#    (las mismas rutas que el proxy de vite.config.js, más las de la v2).
#  - Agrega los headers de seguridad (H-13).
#
#  Este archivo es solo para Docker. frontend/nginx.conf es el de la V2 en EC2 sin
#  contenedores (ver docs/DEPLOY.md).
# ==============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # DNS interno de Docker: los nombres de los contenedores se resuelven en cada
    # petición (con caché de 10 s), así Nginx no falla si un servicio se reinicia
    # y cambia de IP, ni al arrancar si un servicio aún no está listo.
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # --------------------------------------------------------------------------
    # Headers de seguridad (H-13). "always" los agrega también a las respuestas
    # de error. Las location de abajo no usan add_header, así que los heredan.
    # CSP:
    #   - script/style/font/img solo del propio sitio: Bootstrap y bootstrap-icons
    #     vienen empaquetados en dist/. 'unsafe-inline' en style-src es necesario
    #     para los atributos style que usan React y React Bootstrap.
    #   - img-src 'self' data: las imágenes de productos deben ser rutas /IMAGENES/...
    #     (una URL externa queda bloqueada).
    #   - frame-src: mapa de Google Maps (Tiendas) y video de YouTube (Consejos).
    #   - connect-src 'self': la API se consume por /api/... en el mismo origen.
    # --------------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src https://www.google.com https://www.youtube.com https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # --------------------------------------------------------------------------
    # Proxy de la API (v1 y v2) hacia cada microservicio
    # --------------------------------------------------------------------------
    # IP real del navegador: Nginx es el borde, por eso se usa $remote_addr y no se
    # conserva un X-Forwarded-For enviado por el cliente (no puede inventar IPs).
    # ms-auth lo usa para el límite de intentos de login (proxies confiables).
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Igual que el proxy de Vite: se quita Origin. La petición la hace Nginx desde
    # la red interna, y así CORS no rechaza el dominio o la IP pública (EC2).
    proxy_set_header Origin "";
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;

    # ms-auth: login, registro, recuperación, cuenta y usuarios
    location ~ ^/api/v[12]/(auth|usuarios|cuenta)(/|$) {
        set $destino http://ms-auth:8081;
        proxy_pass $destino;
    }

    # ms-catalogoProductos
    location ~ ^/api/v[12]/productos(/|$) {
        set $destino http://ms-catalogoproductos:8082;
        proxy_pass $destino;
    }

    # ms-inventario
    location ~ ^/api/v[12]/inventario(/|$) {
        set $destino http://ms-inventario:8084;
        proxy_pass $destino;
    }

    # ms-ventas
    location ~ ^/api/v[12]/ventas(/|$) {
        set $destino http://ms-ventas:8086;
        proxy_pass $destino;
    }

    # Cualquier otra ruta /api/ no existe (no se devuelve la SPA en su lugar)
    location /api/ {
        default_type application/json;
        return 404 '{"mensaje":"Recurso no encontrado"}';
    }

    # --------------------------------------------------------------------------
    # SPA: si el archivo no existe, se entrega index.html y React Router resuelve
    # la ruta (/productos, /admin, /carrito...). Así refrescar no da 404.
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html sin caché, para que el navegador tome siempre la versión nueva
    location = /index.html {
        expires -1;
    }

    # Estáticos con caché (los JS y CSS de Vite llevan un hash en el nombre)
    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|webp|css|js|woff2?)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }
}
