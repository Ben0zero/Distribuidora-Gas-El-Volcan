<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="CSS/estilos.css">
</head>
<a href="tiendas.html" class="boton-tienda">
    <img src="IMAGENES/loguito-boton.png" alt="Encuentra tu tienda más cercana"> </a>
<body>
<header>
    <div class="container ">
        <div class="row align-items-center text-center">
            
                <div class="col">
                    <img src="IMAGENES/Logo Gas.png" style="width: 90px;" alt="Logo Coorporativo">
                </div>
                <div class="col">
                    <a href="index.html" class="btn" role="button" > Inicio</a>
                    <a href="catalogo.html" class="btn " role="button" > Catalogo</a>
                    <a href="consejos.html" class="btn" role="button" > Consejos</a> 
                    <a href="contacto.html" class="btn boton-nav" role="button" ><strong>Contacto</strong> </a>                    
                </div>
                <div class="col">                    
                     <a href="login.html" class="btn btn-login " role="button" > Acceder</a>
                </div>          
        </div>
    </div>
</header>
<main class="Contacto fondo">
    <section class="hero-contacto ">

        <div class="container">
            <div class="row align-items-center ">

                <div class="col-md-7 texto-3">
                    <h1 >Contáctanos</h1>

                    <h3>Estamos aquí para ayudarte</h3>

                    <h4 class="my-3">
                        Si tienes dudas, necesitas hacer un pedido
                        o quieres más información sobre nuestros
                        productos y servicios, escríbenos o llámanos.
                    </h4>
                </div>           
            </div>
        </div>
    </section>
    <section class="contacto-contenido">

    <div class="container">

        <div class="row g-4">

            <!-- FORMULARIO -->
            <div class="col-12 col-lg-7">

                <div class="card">
                    <div class="card-body">
                        <h2 class="texto-2 text-start">Envíanos un mensaje</h2>
                        <form id="form-contacto">
                            <div class="mb-3">
                                <label for="nombre" class="texto-2 text-start">
                                    Nombre completo
                                </label>
                                <input type="text"
                                       id="nombre"
                                       class="form-control">
                            </div>
                            <div class="mb-3">
                                <label for="correo" class="texto-2 text-start">
                                    Correo electrónico
                                </label>
                                <input type="email"
                                       id="correo"
                                       class="form-control">
                            </div>
                            <div class="mb-3">
                                <label for="telefono" class="texto-2 text-start">
                                    Teléfono
                                </label>
                                <input type="tel"
                                       id="telefono"
                                       class="form-control">
                            </div>
                            <div class="mb-3">
                                <label for="asunto" class="texto-2 text-start">
                                    Asunto
                                </label>
                                <select id="asunto"
                                        class="form-select">
                                    <option>
                                        Seleccione una opción
                                    </option>
                                    <option>
                                        Consulta sobre productos
                                    </option>
                                    <option>
                                        Pedido
                                    </option>
                                    <option>
                                        Reclamo
                                    </option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="mensaje" class="texto-2 text-start">
                                    Mensaje
                                </label>
                                <textarea id="mensaje"
                                          class="form-control"
                                          rows="4"
                                          style="resize: none;"></textarea>
                            </div>
                            <button type="submit"
                                    class="btn btn-login">
                                Enviar mensaje
                            </button>

                        </form>
                    </div>
                </div>
            </div>
            <!-- INFORMACIÓN -->
            <div class="col-12 col-lg-5 text-center">

                <img src="IMAGENES/persona con cilindro 2.png" alt="persona con cilindro de gas" class="persona-contacto">

               
            </div>

        </div>

    </div>

</section>

        
       
           
</main>   
<footer>
    <div class="container py-3">
        <div class="row align-items-center text-center">
            
                <div class="col">
                    <img src="IMAGENES/Logo Gas.png" style="width: 90px;" alt="Logo Coorporativo">
                </div>
                <div class="col">
                    <h5>Contacto</h5>  
                    <p>+56 42 234 5678 · pedidos@elvolcangas.cl</p>                 
                </div>
                <div class="col">                    
                        <figcaption class="blockquote-footer">
                        © 2026 Distribuidora de Gas El Volcán. Proyecto académico DSY1104.
                        </figcaption>
                </div>          
        </div>
    </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script> 
</body>
</html>
