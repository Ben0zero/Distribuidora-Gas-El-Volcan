<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login-Gas-Volcan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="CSS/estilosLogin.css">
</head>
<body>
    <section id="inicio-sesion" class="text-center">
        <img src="IMAGENES/Logo Gas.png" style="width: 250px;" alt="Logo Gas Volcan">
            <div id="inicio-datos" class="login-usuario ">
                <h2 class="text-center my-3" style="font">Bienvenido de nuevo</h2>
                <h3 class="text-center my-3">Ingresa a tu cuenta para continuar</h3>
                    <div class="recuadro-4">
                        <div class="row justify-content-center">
                            <div class="col-12 col-md-8 col-lg-6">
                                <form action="" id="form-login" class="recuadro-4">
                                    <div class="mb-3">
                                        <label for="nombre" class="form-label">
                                            Correo electronico
                                        </label>
                                        <input type="text"
                                        id="correo"
                                        class="form-control"
                                        placeholder="Ingrese su correo">
                                    </div>
                                    <div class="mb-3">
                                        <label for="contrasena" class="form-label">
                                            Contraseña
                                        </label>
                                        <input type="text"
                                        id="contrasena"
                                        class="form-control"
                                        placeholder="Ingrese su contrasena">
                                    </div>
                                    
                                </form>
                            </div>
                        </div>
                    </div>
                <div class="text-center">
                <button id="login" class="btn btn-dark px-5 py-2 mt-3 boton-login">
                    Login
                </button>
                </div>
            </div>
        </section>        
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script> 
</body>
</html>
