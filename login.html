<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login-Gas-Volcan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="CSS/estilos.css">
</head>
<a href="tiendas.html" class="boton-tienda">
    <img src="IMAGENES/loguito-boton.png" alt="Encuentra tu tienda más cercana"> </a>
<body>
    <header>
        <div class="container ">
            <div class="row align-items-center text-center">
                
                    <div class="col">
                        <img src="IMAGENES/Logo Gas.png" style="width: 90px;" alt="Logo Coorporativo">
                    </div>
                    <div class="col">
                        <a href="index.html" class="btn" role="button" > Inicio</a>
                        <a href="catalogo.html" class="btn" role="button" >Catalogo</a>
                        <a href="consejos.html" class="btn" role="button" > Consejos</a>
                        <a href="contacto.html" class="btn" role="button" > Contacto</a>                    
                    </div>
                    <div class="col">                    
                        <a href="login.html" role="button" ></a>
                    </div>          
            </div>
        </div>
    </header>
    <main>
        <section id="inicio-sesion" class="fondo text-center">
                <div id="inicio-datos" class="container login-usuario text-center">
                    <div class="row justify-content-center">
                        <div class="col-12 col-md-10 col-lg-6">                      
                            <div class="bg-white p-4 p-md-5 my-5 rounded-4 shadow-lg text-center">
                                <img src="IMAGENES/Logo Gas.png" style="width: 250px;" alt="Logo Gas Volcan">
                                <h1 class="text-center my-1 texto-2">Bienvenido de nuevo</h1>
                                <h4 class="text-center mb-5 texto-2">Ingresa a tu cuenta para continuar</h4>
                                        <div class="row justify-content-center">
                                            <div class="col-12 col-md-8 col-lg-8">                                          
                                                    <form action="" id="form-login">
                                                        <div class="mb-3 text-start">
                                                            <label for="nombre" class="form-label text-start texto-2">
                                                                Correo electronico
                                                            </label>
                                                            <input type="text"
                                                            id="correo"
                                                            class="form-control"
                                                            placeholder="Ingrese su correo">
                                                        </div>
                                                        <div class="mb-3 text-start">
                                                            <label for="contrasena" class="form-label texto-2">
                                                                Contraseña
                                                            </label>
                                                            <input type="text"
                                                            id="contrasena"
                                                            class="form-control"
                                                            placeholder="Ingrese su contrasena">
                                                        </div>                                               
                                                    </form>
                                                    <div class="text-center">
                                                        <button id="login" class="btn btn-login mt-4 px-5 pb-2" role="button">
                                                            Login
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                
                            </div>
                        </div> 
                    </div>
                </div>
        </section>        
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script> 
    </main>

    <footer>
    <div class="container py-3">
        <div class="row align-items-center text-center">
            
                <div class="col">
                    <img src="IMAGENES/Logo Gas.png" style="width: 90px;" alt="Logo Coorporativo">
                </div>
                <div class="col">
                    <h5>Contacto</h5>  
                    <p>+56 42 234 5678 · pedidos@elvolcangas.cl</p>                 
                </div>
                <div class="col">                    
                        <figcaption class="blockquote-footer">
                        © 2026 Distribuidora de Gas El Volcán. Proyecto académico DSY1104.
                        </figcaption>
                </div>          
        </div>
    </div>

</footer>
</body>
</html>
